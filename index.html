<!       <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pitik Nglayap - Petualangan Si Pitik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1512;
            color: #f0e6d2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header & Logo Pitik Nglayap */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #ff9900, #ff5500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: #ffaa00;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px #ffaa00;
            border: 2px solid #fff;
        }
        /* Jengger Ayam pada Logo */
        .logo-icon::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 10px;
            width: 12px;
            height: 8px;
            background: #ff0044;
            border-radius: 5px 5px 0 0;
        }
        /* Paruh Ayam */
        .logo-icon::after {
            content: '';
            position: absolute;
            top: 12px;
            right: -4px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 8px solid #ff3300;
        }

        /* Panel Info Game */
        .info-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            align-items: center;
        }
        .info-box {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .info-box span {
            color: #ffaa00;
        }

        /* Canvas Game */
        #game-container {
            position: relative;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 153, 0, 0.2);
            overflow: hidden;
            border: 3px solid #4a3828;
        }
        canvas {
            display: block;
            background: #2d3b1e; /* Warna Pedesaan/Rumput */
        }

        /* Controls & Cara Bermain */
        .controls-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
            padding: 0 10px;
        }
        
        .how-to-play {
            font-size: 0.75rem;
            color: #c2b59b;
            max-width: 210px;
            line-height: 1.35;
        }
        .how-to-play b {
            color: #ffaa00;
        }

        /* Virtual Joystick */
        #joystick-container {
            width: 85px;
            height: 85px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 170, 0, 0.4);
            border-radius: 50%;
            position: relative;
            touch-action: none;
        }
        #joystick-knob {
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #ffaa00, #ff5500);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #ffaa00;
            pointer-events: none;
        }

        /* Tombol Audio */
        .btn-audio {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 170, 0, 0.4);
            color: #fff;
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .btn-audio:hover {
            background: rgba(255, 170, 0, 0.2);
        }

        /* Overlay Game Over / Win */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 21, 18, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #overlay h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ff3300;
            text-shadow: 0 0 10px #ff3300;
        }
        #overlay p {
            margin-bottom: 18px;
            font-size: 0.95rem;
            color: #ddd;
            text-align: center;
            padding: 0 20px;
        }
        #overlay button {
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #1a1512;
            background: #ffaa00;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 12px #ffaa00;
            transition: transform 0.2s;
        }
        #overlay button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Header & Logo Game -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon"></div>
            Pitik Nglayap
        </div>
    </div>

    <!-- Info Panel (Skor, Level, Musik) -->
    <div class="info-panel">
        <div class="info-box">Level: <span id="level-txt">1</span></div>
        <div class="info-box">Skor: <span id="score-txt">0</span></div>
        <button class="btn-audio" id="audio-btn" onclick="toggleAudio()">🔊 Musik: ON</button>
    </div>

    <!-- Area Game Canvas -->
    <div id="game-container">
        <canvas id="canvas" width="400" height="400"></canvas>
        <div id="overlay">
            <h2 id="overlay-title">PITIK KECEPET!</h2>
            <p id="overlay-desc">Si Pitik tertangkap rintangan saat nglayap!</p>
            <button onclick="restartGame()">Balen (Coba Lagi)</button>
        </div>
    </div>

    <!-- Kontrol Game -->
    <div class="controls-area">
        <div class="how-to-play">
            <b>Cara Bermain:</b><br>
            • Keyboard: <b>Panah / WASD</b>.<br>
            • Mobile: Geser <b>Joystick</b>.<br>
            • Bantu <b>Pitik (Kuning)</b> nglayap menuju <b>Kandang (Hijau)</b>. Hindari <b>Srigala (Merah)</b> & Pagar!
        </div>
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Elemen UI
        const levelTxt = document.getElementById('level-txt');
        const scoreTxt = document.getElementById('score-txt');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const audioBtn = document.getElementById('audio-btn');

        // Audio Synthesizer (Web Audio API)
        let audioCtx = null;
        let isAudioMuted = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBGM();
            }
        }

        function playSound(freq, type, duration) {
            if (isAudioMuted || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        // BGM Bergaya Tradisional Sederhana
        function startBGM() {
            const notes = [220, 247, 277, 330, 370]; // Pentatonik
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isAudioMuted && audioCtx) {
                    playSound(notes[step % notes.length], 'sine', 0.25);
                    step++;
                }
            }, 450);
        }

        function toggleAudio() {
            initAudio();
            isAudioMuted = !isAudioMuted;
            audioBtn.innerText = isAudioMuted ? "🔇 Musik: OFF" : "🔊 Musik: ON";
        }

        // Variabel Game
        const gridCols = 10;
        const gridRows = 10;
        const cellSize = canvas.width / gridCols;

        let level = 1;
        let score = 0;
        let isGameOver = false;

        // Karakter Utama: Pitik (Ayam) & Kandang (Goal)
        let pitik = { x: 0, y: 0 };
        let kandang = { x: gridCols - 1, y: gridRows - 1 };

        let map = [];
        let enemies = [];

        // Inisialisasi Peta & Rintangan
        function generateMap() {
            map = Array.from({ length: gridRows }, () => Array(gridCols).fill(0));

            // Pagar / Semak-semak Rintangan
            let wallCount = 12 + Math.min(level * 2, 30);
            for (let i = 0; i < wallCount; i++) {
                let rx = Math.floor(Math.random() * gridCols);
                let ry = Math.floor(Math.random() * gridRows);
                if ((rx !== 0 || ry !== 0) && (rx !== kandang.x || ry !== kandang.y)) {
                    map[ry][rx] = 1; // 1 = Pagar
                }
            }

            // Musuh (Srigala / Musang)
            enemies = [];
            let enemyCount = Math.min(Math.floor(level / 2) + 1, 6);
            for (let i = 0; i < enemyCount; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * gridCols);
                    ey = Math.floor(Math.random() * gridRows);
                } while (map[ey][ex] === 1 || (ex === 0 && ey === 0) || (ex === kandang.x && ey === kandang.y));

                enemies.push({ x: ex, y: ey, dir: Math.random() < 0.5 ? 1 : -1, axis: Math.random() < 0.5 ? 'x' : 'y' });
            }
        }

        // Gambar Visual Game
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Rumput & Pattern Latar
            ctx.fillStyle = '#223018';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            for (let i = 0; i < canvas.width; i += cellSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Gambar Pagar / Semak (Rintangan Diam)
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (map[r][c] === 1) {
                        ctx.fillStyle = '#4a3828'; // Pagar Kayu
                        ctx.fillRect(c * cellSize + 4, r * cellSize + 4, cellSize - 8, cellSize - 8);
                        ctx.strokeStyle = '#2b2016';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(c * cellSize + 4, r * cellSize + 4, cellSize - 8, cellSize - 8);
                    }
                }
            }

            // Gambar Kandang (Goal)
            ctx.fillStyle = '#28a745';
            ctx.shadowColor = '#28a745';
            ctx.shadowBlur = 10;
            ctx.fillRect(kandang.x * cellSize + 6, kandang.y * cellSize + 6, cellSize - 12, cellSize - 12);
            ctx.shadowBlur = 0;

            // Gambar Musuh (Srigala/Musang - Merah)
            enemies.forEach(e => {
                let cx = (e.x + 0.5) * cellSize;
                let cy = (e.y + 0.5) * cellSize;

                ctx.fillStyle = '#ff3300';
                ctx.shadowColor = '#ff3300';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize / 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Gambar Pitik (Karakter Utama - Kuning/Oranye)
            let px = (pitik.x + 0.5) * cellSize;
            let py = (pitik.y + 0.5) * cellSize;

            ctx.fillStyle = '#ffaa00';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(px, py, cellSize / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Jengger Pitik
            ctx.fillStyle = '#ff0044';
            ctx.beginPath();
            ctx.arc(px, py - 10, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Pergerakan Pitik
        function movePitik(dx, dy) {
            initAudio();
            if (isGameOver) return;

            let newX = pitik.x + dx;
            let newY = pitik.y + dy;

            if (newX >= 0 && newX < gridCols && newY >= 0 && newY < gridRows) {
                if (map[newY][newX] !== 1) {
                    pitik.x = newX;
                    pitik.y = newY;
                    playSound(480, 'sine', 0.04); // Sound langkah pitik
                    checkState();
                }
            }
        }

        // Pergerakan Musuh
        function updateEnemies() {
            if (isGameOver) return;
            enemies.forEach(e => {
                let nextX = e.x;
                let nextY = e.y;

                if (e.axis === 'x') nextX += e.dir;
                else nextY += e.dir;

                if (nextX < 0 || nextX >= gridCols || nextY < 0 || nextY >= gridRows || map[nextY][nextX] === 1) {
                    e.dir *= -1;
                } else {
                    e.x = nextX;
                    e.y = nextY;
                }
            });
            checkState();
        }

        // Cek Status Game
        function checkState() {
            // Nabrak Musuh
            enemies.forEach(e => {
                if (e.x === pitik.x && e.y === pitik.y) {
                    playSound(140, 'sawtooth', 0.35);
                    endGame(false);
                }
            });

            // Sampai di Kandang
            if (pitik.x === kandang.x && pitik.y === kandang.y) {
                score += 150 + (level * 25);
                level++;
                scoreTxt.innerText = score;
                levelTxt.innerText = level;
                playSound(650, 'sine', 0.18);
                initLevel();
            }
        }

        function endGame(isWin) {
            isGameOver = true;
            overlay.classList.add('active');
            if (!isWin) {
                overlayTitle.innerText = "PITIK KECEPET!";
                overlayTitle.style.color = "#ff3300";
                overlayDesc.innerText = `Pitik nglayap keterlaluasi & kecepet rintangan ing Level ${level}. Total Skor: ${score}`;
            }
        }

        function restartGame() {
            level = 1;
            score = 0;
            scoreTxt.innerText = score;
            levelTxt.innerText = level;
            isGameOver = false;
            overlay.classList.remove('active');
            initLevel();
        }

        function initLevel() {
            pitik = { x: 0, y: 0 };
            generateMap();
            draw();
        }

        // Kontrol Keyboard
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': movePitik(0, -1); break;
                case 'ArrowDown': case 's': case 'S': movePitik(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': movePitik(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': movePitik(1, 0); break;
            }
        });

        // Kontrol Virtual Joystick
        const joystick = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let joyActive = false;
        let startX, startY;

        joystick.addEventListener('pointerdown', (e) => {
            joyActive = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!joyActive) return;
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            let dist = Math.min(Math.hypot(dx, dy), 28);
            let angle = Math.atan2(dy, dx);

            knob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        });

        window.addEventListener('pointerup', (e) => {
            if (!joyActive) return;
            joyActive = false;
            knob.style.transform = `translate(-50%, -50%)`;

            let dx = e.clientX - startX;
            let dy = e.clientY - startY;

            if (Math.hypot(dx, dy) > 15) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    movePitik(dx > 0 ? 1 : -1, 0);
                } else {
                    movePitik(0, dy > 0 ? 1 : -1);
                }
            }
        });

        // Game Loop untuk Musuh
        setInterval(() => {
            updateEnemies();
            draw();
        }, 380);

        // Jalankan Game Pertama Kali
        initLevel();
    </script>
</body>
                </html>
