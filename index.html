<script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameActive = true;
        let score = 0;
        let currentLevel = 1;
        let baseSpeed = 4.8;
        let vehicleSpeed = 4.8;
        let spawnTimer = 0;
        let wheelAngle = 0; 

        // Efek Atmosfer Daun Berguguran
        let leaves = [];
        for(let i=0; i<15; i++) {
            leaves.push({
                x: Math.random() * canvas.width,
                y: Math.random() * 140,
                size: Math.random() * 4 + 2,
                speed: Math.random() * 0.5 + 0.3,
                wobble: Math.random() * 2
            });
        }

        const pitik = {
            x: 80,
            y: 250, 
            width: 36,
            height: 36,
            gravity: 0.65,
            lift: -12.5,
            velocity: 0,
            groundY: 250,
            jump: function() {
                if (this.y === this.groundY && gameActive) {
                    this.velocity = this.lift;
                }
                if (!gameActive) {
                    resetGame();
                }
            },
            update: function() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                if (this.y > this.groundY) {
                    this.y = this.groundY;
                    this.velocity = 0;
                }
            },
            draw: function() {
                // Kaki Ayam Emas
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x + 12, this.y + 25);
                ctx.lineTo(this.x + 12, this.y + 36);
                ctx.moveTo(this.x + 24, this.y + 25);
                ctx.lineTo(this.x + 24, this.y + 36);
                ctx.stroke();

                // Bulu Ekor Belakang
                ctx.fillStyle = '#d97706';
                ctx.beginPath();
                ctx.moveTo(this.x + 4, this.y + 16);
                ctx.quadraticCurveTo(this.x - 6, this.y + 2, this.x + 6, this.y + 8);
                ctx.fill();

                // Badan Utama
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(this.x + 16, this.y + 16, 14, 0, Math.PI * 2);
                ctx.fill();

                // Sayap Ayam
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.ellipse(this.x + 12, this.y + 18, 8, 5, Math.PI/6, 0, Math.PI * 2);
                ctx.fill();

                // Leher & Kepala
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(this.x + 28, this.y + 6, 9, 0, Math.PI * 2);
                ctx.fill();

                // Jengger Merah Menyala
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(this.x + 25, this.y - 4, 3.5, 0, Math.PI * 2);
                ctx.arc(this.x + 30, this.y - 3, 3.5, 0, Math.PI * 2);
                ctx.fill();

                // Paruh Oranye
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(this.x + 35, this.y + 4);
                ctx.lineTo(this.x + 43, this.y + 8);
                ctx.lineTo(this.x + 35, this.y + 12);
                ctx.fill();

                // Mata
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(this.x + 30, this.y + 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        let vehicles = [];
        const vehicleTypes = [
            { type: 'sedan', width: 85, height: 35, color: '#ff0055' },
            { type: 'truck', width: 115, height: 55, color: '#00b4d8' },
            { type: 'motor', width: 48, height: 32, color: '#ffb703' }
        ];

        const trees = [
            { x: 40, size: 55 }, { x: 130, size: 75 }, { x: 240, size: 50 },
            { x: 340, size: 70 }, { x: 470, size: 80 }, { x: 590, size: 55 },
            { x: 700, size: 65 }
        ];

        function spawnVehicle() {
            let randomType = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
            vehicles.push({
                x: canvas.width,
                y: 286 - randomType.height,
                width: randomType.width,
                height: randomType.height,
                color: randomType.color,
                type: randomType.type,
                speed: vehicleSpeed
            });
        }

        function drawEnvironment() {
            // 1. Langit Senja Estetik (Gradasi Linear)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, 150);
            skyGrad.addColorStop(0, '#fdba74');
            skyGrad.addColorStop(0.5, '#f472b6');
            skyGrad.addColorStop(1, '#38bdf8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 150);

            // 2. Menggambar Pohon Hutan Pinus
            trees.forEach(tree => {
                ctx.fillStyle = '#065f46'; 
                ctx.beginPath();
                ctx.moveTo(tree.x, 150 - tree.size);
                ctx.lineTo(tree.x - (tree.size * 0.45), 150);
                ctx.lineTo(tree.x + (tree.size * 0.45), 150);
                ctx.fill();

                ctx.fillStyle = '#059669'; 
                ctx.beginPath();
                ctx.moveTo(tree.x, 150 - (tree.size * 0.75));
                ctx.lineTo(tree.x - (tree.size * 0.35), 150);
                ctx.lineTo(tree.x + (tree.size * 0.35), 150);
                ctx.fill();
            });

            // Animasi Daun Berguguran
            ctx.fillStyle = 'rgba(52, 211, 153, 0.6)';
            leaves.forEach(leaf => {
                leaf.y += leaf.speed;
                leaf.x += Math.sin(leaf.y * 0.05) * 0.3;
                if(leaf.y > 140) leaf.y = 0;
                ctx.beginPath();
                ctx.arc(leaf.x, leaf.y, leaf.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Semak Belukar Pembatas Atas Jalan
            ctx.fillStyle = '#10b981';
            ctx.fillRect(0, 140, canvas.width, 20);
            
            ctx.fillStyle = '#34d399';
            for(let i = -10; i < canvas.width + 20; i += 40) {
                ctx.beginPath();
                ctx.arc(i + 15, 145, 10, 0, Math.PI, true);
                ctx.fill();
            }

            // 4. Badan Aspal Jalan Raya Modern
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 160, canvas.width, 125);

            // Marka Jalan Tengah Putih Bersih
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 20]);
            ctx.beginPath();
            ctx.moveTo(0, 220);
            ctx.lineTo(canvas.width, 220);
            ctx.stroke();
            ctx.setLineDash([]);

            // Pembatas Garis Kuning Neon
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(0, 280, canvas.width, 5);
            
            // Base layer tanah/rumput tua gelap
            let grassGrad = ctx.createLinearGradient(0, 285, 0, canvas.height);
            grassGrad.addColorStop(0, '#059669');
            grassGrad.addColorStop(1, '#064e3b');
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, 285, canvas.width, 75);

            // LAYER RUMPUT 1: Rimbun Belakang (Warna Hijau Mint Cerah)
            ctx.fillStyle = '#10b981';
            for (let i = -5; i < canvas.width + 10; i += 8) {
                let grassHeight = 16 + Math.sin(i * 0.08) * 6; 
                ctx.beginPath();
                ctx.moveTo(i, 285);
                ctx.lineTo(i + 5, 285 - grassHeight);
                ctx.lineTo(i + 10, 285);
                ctx.fill();
            }

            // LAYER RUMPUT 2: Rimbun Depan (Warna Hijau Lebih Muda/Pastel)
            ctx.fillStyle = '#34d399';
            for (let i = -2; i < canvas.width + 10; i += 12) {
                let grassHeight = 12 + Math.cos(i * 0.1) * 4;
                ctx.beginPath();
                ctx.moveTo(i, 287);
                ctx.lineTo(i + 6, 287 - grassHeight);
                ctx.lineTo(i + 12, 287);
                ctx.fill();
            }

            // LAYER RUMPUT 3: Variasi Rumput Liar Panjang Berkelompok
            ctx.fillStyle = '#6ee7b7';
            for (let i = 20; i < canvas.width; i += 60) {
                ctx.beginPath();
                ctx.moveTo(i, 310); ctx.lineTo(i - 4, 292); ctx.lineTo(i + 2, 310);
                ctx.moveTo(i + 2, 310); ctx.lineTo(i + 5, 288); ctx.lineTo(i + 8, 310);
                ctx.fill();
            }

            // AKSEN TAMBAHAN: Bunga Liar Estetik Kuning Putih Bertebaran
            for (let i = 40; i < canvas.width; i += 95) {
                let flowerY = 315 + Math.sin(i) * 12;
                
                // Kelopak Putih
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(i - 3, flowerY, 2.5, 0, Math.PI * 2);
                ctx.arc(i + 3, flowerY, 2.5, 0, Math.PI * 2);
                ctx.arc(i, flowerY - 3, 2.5, 0, Math.PI * 2);
                ctx.arc(i, flowerY + 3, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Putik Tengah Oranye/Kuning
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.arc(i, flowerY, 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawWheel(x, y, radius, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#e2e8f0';
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-radius, 0); ctx.lineTo(radius, 0);
            ctx.moveTo(0, -radius); ctx.lineTo(0, radius);
            ctx.stroke();
            ctx.restore();
        }

        function checkCollision(rect1, rect2) {
            const paddingX = 8;
            const paddingY = 5;
            return rect1.x < rect2.x + rect2.width - paddingX &&
                   rect1.x + rect1.width > rect2.x + paddingX &&
                   rect1.y < rect2.y + rect2.height - paddingY &&
                   rect1.y + rect1.height > rect2.y + paddingY;
        }

        function updateLevelSystem() {
            currentLevel = Math.floor(score / 10) + 1;
            vehicleSpeed = baseSpeed + (currentLevel - 1) * 0.75;
        }

        function resetGame() {
            vehicles = [];
            score = 0;
            currentLevel = 1;
            vehicleSpeed = baseSpeed;
            gameActive = true;
            loop();
        }

        function loop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment();

            pitik.update();
            pitik.draw();

            updateLevelSystem();
            wheelAngle -= 0.18;

            spawnTimer++;
            let dynamicInterval = Math.max(45, 90 - (currentLevel * 4));
            if (spawnTimer > Math.random() * (dynamicInterval + 30) + dynamicInterval) {
                spawnVehicle();
                spawnTimer = 0;
            }

            for (let i = vehicles.length - 1; i >= 0; i--) {
                let v = vehicles[i];
                v.x -= v.speed;

                ctx.fillStyle = v.color;

                if (v.type === 'sedan') {
                    ctx.fillRect(v.x, v.y + 12, v.width, v.height - 12);
                    ctx.beginPath();
                    ctx.moveTo(v.x + 15, v.y + 12);
                    ctx.lineTo(v.x + 32, v.y);
                    ctx.lineTo(v.x + 65, v.y);
                    ctx.lineTo(v.x + 76, v.y + 12);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                    ctx.fillRect(v.x + 35, v.y + 3, 25, 7);
                    ctx.fillStyle = '#ffea00';
                    ctx.fillRect(v.x, v.y + 16, 6, 7);

                    drawWheel(v.x + 18, v.y + v.height - 2, 8.5, wheelAngle);
                    drawWheel(v.x + v.width - 18, v.y + v.height - 2, 8.5, wheelAngle);

                } else if (v.type === 'truck') {
                    ctx.fillStyle = '#f1f5f9';
                    ctx.fillRect(v.x + 35, v.y, v.width - 35, v.height - 4);
                    ctx.fillStyle = 'rgba(52, 211, 153, 0.2)';
                    ctx.fillRect(v.x + 40, v.y + 5, v.width - 45, v.height - 15);

                    ctx.fillStyle = v.color;
                    ctx.fillRect(v.x, v.y + 12, 35, v.height - 16);
                    ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
                    ctx.fillRect(v.x + 2, v.y + 16, 16, 12);
                    ctx.fillStyle = '#e11d48';
                    ctx.fillRect(v.x + v.width - 5, v.y + v.height - 15, 5, 8);

                    drawWheel(v.x + 16, v.y + v.height - 4, 11, wheelAngle);
                    drawWheel(v.x + v.width - 38, v.y + v.height - 4, 11, wheelAngle);
                    drawWheel(v.x + v.width - 16, v.y + v.height - 4, 11, wheelAngle);

                } else if (v.type === 'motor') {
                    ctx.beginPath();
                    ctx.moveTo(v.x, v.y + 8); 
                    ctx.lineTo(v.x + 15, v.y + 15); 
                    ctx.lineTo(v.x + 38, v.y + 15); 
                    ctx.lineTo(v.x + v.width, v.y + v.height - 8);
                    ctx.lineTo(v.x, v.y + v.height - 4);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(v.x, v.y + 12, 5, 5);

                    drawWheel(v.x + 8, v.y + v.height - 2, 7.5, wheelAngle);
                    drawWheel(v.x + v.width - 8, v.y + v.height - 2, 7.5, wheelAngle);
                }

                if (checkCollision(pitik, v)) {
                    gameActive = false;
                }

                if (v.x + v.width < 0) {
                    vehicles.splice(i, 1);
                    score++;
                }
            }

            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 17px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('🏆 SKOR PERMAINAN: ' + score, 30, 38);
            ctx.shadowBlur = 0; 
            
            let hue = Math.max(0, 140 - (currentLevel * 9));
            ctx.fillStyle = `hsl(${hue}, 85%, 45%)`;
            ctx.beginPath();
            ctx.roundRect(30, 52, 120, 28, 8);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 13px "Plus Jakarta Sans", sans-serif';
            ctx.fillText('⚡ LEVEL: ' + currentLevel, 45, 71);

            if (gameActive) {
                requestAnimationFrame(loop);
            } else {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 32px "Plus Jakarta Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('KASIAN, PITIKNYA TERTABRAK! 💥', canvas.width / 2, canvas.height / 2 - 15);
                
                ctx.fillStyle = '#f8fafc';
                ctx.font = '600 16px "Plus Jakarta Sans", sans-serif';
                ctx.fillText('Kamu Bertahan Sampai Level ' + currentLevel + ' dengan Skor ' + score, canvas.width / 2, canvas.height / 2 + 25);
                
                ctx.fillStyle = '#fbbf24';
                ctx.font = '500 14px "Plus Jakarta Sans", sans-serif';
                ctx.fillText('Tekan SPASI / KLIK Area Game untuk Mencoba Kembali', canvas.width / 2, canvas.height / 2 + 60);
                ctx.textAlign = 'left';
            }
        }

        // --- PENAMBAHAN KODE KONTROL & START GAME ---

        // Kontrol dengan Tombol Keyboard (Spasi)
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                pitik.jump();
            }
        });

        // Kontrol dengan Klik Layar / Touchscreen
        canvas.addEventListener('click', function() {
            pitik.jump();
        });

        // Memulai Loop Game Pertama Kali
        loop();
    </script>
